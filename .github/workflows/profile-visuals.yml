name: Profile visuals

on:
  schedule:
    - cron: "30 19 * * *" # 01:00 IST daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#E8CF85&color_dots=#161B22,#3D3420,#6B5A2E,#A68B45,#E8CF85
            dist/snake-light.svg?palette=github-light&color_snake=#8A6D1F&color_dots=#EBEDF0,#F3E6BF,#E0C574,#C9A94A,#8A6D1F

      - run: cp profile-3d-contrib/*.svg dist/

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
